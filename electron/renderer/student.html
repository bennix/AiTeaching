<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学生学习中心</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/extra.css"><link rel="stylesheet" href="/student.css"><link rel="stylesheet" href="/vendor/katex/katex.min.css"><link rel="stylesheet" href="/rich-text.css"></head>
<body class="student-body">
  <header class="student-header"><div class="student-brand"><div class="brand-mark">AI</div><div><strong>学生学习中心</strong><span id="student-identity">AI 教学助手</span></div></div><nav><button class="student-nav active" data-student-view="learn">学习与练习</button><button class="student-nav" data-student-view="materials">课程资料</button><button class="student-nav" data-student-view="history">学习记录</button><button id="student-logout" class="student-nav">退出</button></nav></header>
  <main class="student-main">
    <div id="student-toast" class="toast" hidden></div>
    <section id="student-view-learn" class="student-view active">
      <div class="hero-card"><div><span class="eyebrow">本周学习</span><h1 id="student-welcome">你好</h1><p>查看老师发布的教学内容，完成签到与练习。</p></div><div class="lesson-select-wrap"><label>选择教学周</label><select id="student-lesson-select"></select></div></div>
      <div class="student-columns"><div class="panel"><div class="panel-heading"><div><h2 id="student-lesson-title">暂无教学周</h2><p id="student-lesson-meta"></p></div><button id="attendance-button" class="button primary">本课签到</button></div><div id="student-notes" class="student-notes markdown-body">老师尚未发布教学内容。</div></div><div class="panel"><div class="panel-heading"><div><h2>本周练习</h2><p>提交后立即查看结果和 AI 反馈</p></div><span id="exercise-progress" class="badge"></span></div><div id="student-exercises" class="student-exercises"></div></div></div>
    </section>
    <section id="student-view-materials" class="student-view"><div class="panel"><div class="panel-heading"><div><h2>课程资料</h2><p>班级公共资料与当前教学周资料</p></div></div><div id="student-materials" class="material-grid"></div></div></section>
    <section id="student-view-history" class="student-view"><div class="student-columns"><div class="panel"><div class="panel-heading"><div><h2>作答历史</h2><p>回顾答案、正确率和反馈</p></div></div><div id="student-history" class="history-list"></div></div><div class="panel"><div class="panel-heading"><div><h2>AI 学习诊断</h2><p>由教师根据你的学习表现生成</p></div></div><div id="student-report" class="student-notes markdown-body">老师尚未生成学习诊断报告。</div></div></div></section>
  </main>
  <dialog id="student-courseware-preview"><div class="dialog-heading"><div><span class="badge">Markdown · LaTeX</span><h2 id="student-courseware-title">课件预览</h2><p>公式、表格、代码与教学内容均可直接阅读</p></div><button id="student-courseware-close" class="icon-button">×</button></div><div id="student-courseware-content" class="document-content markdown-body"></div></dialog>
  <dialog id="student-login" class="login-dialog"><div class="login-brand"><div class="brand-mark">AI</div><div><h2>进入学生学习中心</h2><p>请选择班级并输入学号</p></div></div><form id="student-login-form" class="stack"><label><span>班级</span><select name="className" id="student-class-select"><option value="">请选择班级</option></select></label><label><span>学号</span><input name="studentId" required autocomplete="username"></label><button class="button primary wide">开始学习</button><a href="/">返回教师端 →</a></form></dialog>
  <script src="/vendor/marked.umd.js"></script><script src="/vendor/purify.min.js"></script><script src="/vendor/katex/katex.min.js"></script><script src="/vendor/katex/auto-render.min.js"></script><script src="/markdown.js"></script><script src="/student.js"></script>
</body></html>
